; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
lib_deps = stm32duino/STM32duino FreeRTOS@^10.3.3

; 1. Remove the default optimization (usually -Os for size)
build_unflags = -Os

; 2. Force Optimization Level 0 (None) and add maximum debug info
build_flags = 
    -O0 
    -g3
    -fno-eliminate-unused-debug-types
    -Wno-cpp  ; This suppresses the #warning "This wrapper was verified..." message

; Set protocol to 'jlink' which defaults to SWD in the ststm32 platform
upload_protocol = jlink

; Set speed to 1000kHz as requested previously
debug_speed = 1000

upload_flags =
    -device
    STM32F103C8
    -speed
    1000
    -if
    swd
    -autoconnect
    1

; Debugging Configuration
debug_tool = jlink
debug_init_break = tbreak setup
debug_extra_cmds =
    monitor if swd
    monitor speed 1000