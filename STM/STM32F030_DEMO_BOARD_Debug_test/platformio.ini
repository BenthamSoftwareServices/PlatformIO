; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:demo_f030f4]
platform = ststm32
board = demo_f030f4
framework = arduino
upload_protocol = custom
upload_command = "C:/Program Files/SEGGER/JLink/JLink.exe" -device STM32F030F4 -speed 4000 -if SWD -autoconnect 1 -CommanderScript upload.jlink
debug_tool = jlink
debug_speed = 4000
debug_init_break = tbreak setup
debug_extra_cmds = monitor reset 0
board_upload.maximum_size = 16384
board_upload.maximum_ram_size = 4096
monitor_speed = 115200
lib_deps = koendv/RTT Stream@^1.4.1
