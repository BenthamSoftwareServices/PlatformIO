; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; Set build type to debug to ensure symbols are generated for GDB
build_type = debug

; Use the built-in USB JTAG/Serial feature of the ESP32-C3
debug_tool = esp-builtin
debug_init_break = break setup

; Optional: Set speed for the internal JTAG bridge (12000 kHz is stable for C3)
debug_speed = 12000

; Inject GDB commands into the launch configuration
; Note: 'set print pretty on' is used for CLI compatibility instead of MI commands
debug_extra_cmds =
    set complaints 0
    set print pretty on