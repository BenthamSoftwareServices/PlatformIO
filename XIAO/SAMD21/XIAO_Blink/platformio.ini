; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao]
platform = atmelsam
board = samd21g18a
framework = arduino

upload_protocol = jlink
debug_tool = jlink

; Set both to 2000 for verified stability with the OB V7
debug_speed = 2000

; Force the linker to start at the base of flash (0x0000)
board_upload.offset_address = 0x0000

; Breakpoint at the very start of the user programme
debug_init_break = tbreak setup

; Define the XIAO identity for library compatibility
build_flags = -DARDUINO_SAMD_XIAO

upload_flags = 
    -speed
    2000