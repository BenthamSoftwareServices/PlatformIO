; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; =========================================
; PlatformIO dual-environment for SAMD21-M0-Mini
; =========================================

; USB upload via SAM-BA (default)
[env:samd21_m0_mini_usb]
platform = atmelsam
board = samd21_m0_mini
framework = arduino
monitor_speed = 115200

; Upload via USB/SAM-BA
upload_protocol = sam-ba

; Debug settings (always J-Link)
debug_tool = jlink
debug_init_break = tbreak setup
debug_load_mode = manual
build_type = debug

; -----------------------------------------
; J-Link upload
[env:samd21_m0_mini_jlink]
platform = atmelsam
board = samd21_m0_mini
framework = arduino
monitor_speed = 115200

; Upload via J-Link SWD
upload_protocol = jlink

; Debug settings (always J-Link)
debug_tool = jlink
debug_init_break = tbreak setup
debug_load_mode = manual
build_type = debug

